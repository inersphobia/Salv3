<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Square">
<meta name="theme-color" content="#000000">
<title>Square</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --amber: #ffb14a; --cool: #6aa8ff; --dim: rgba(168,184,205,0.55); --line: rgba(255,255,255,0.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #c7d3da; overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace; touch-action: manipulation; }
  /* The canvas is sized by layout, never by a number read from the
     window. Whatever the browser reports during launch or rotation,
     the element fills its box; the frame loop matches its pixels to it. */
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  main { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { display: flex; gap: 8px; justify-content: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  button { font: 600 15px system-ui, sans-serif; color: #fff; border: 0; border-radius: 8px;
    min-height: 48px; padding: 0 14px; cursor: pointer; }
  button:disabled { opacity: 0.35; }
  footer button { flex: 1; max-width: 120px; background: #241d10; color: #ffc478;
    box-shadow: inset 0 0 0 1px rgba(255,170,60,0.85); display: flex; align-items: center; justify-content: center; }
  footer svg { width: 26px; height: 26px; fill: currentColor; }
  #bLogs { letter-spacing: 2px; }
  /* the view key: one, two or three lights lit */
  #bView { gap: 7px; }
  #bView i { width: 9px; height: 9px; border-radius: 50%; background: #141922;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
  #bView i.on { background: #ff9500; box-shadow: 0 0 6px rgba(255,149,0,0.8); }

  /* the design menu: a key at the canvas's top left */
  #bMenu { position: absolute; top: 10px; left: 12px; z-index: 2; min-height: 40px; width: 44px; padding: 0;
    background: #241d10; color: #ffc478; box-shadow: inset 0 0 0 1px rgba(255,170,60,0.85);
    display: flex; align-items: center; justify-content: center; }
  #bMenu svg { width: 22px; height: 22px; fill: currentColor; }
  #bMenu.open { z-index: 11; background: #3a2c12; }
  #menu { align-items: flex-start; padding-top: calc(60px + env(safe-area-inset-top)); }
  #menu .box { max-height: 100%; overflow-y: auto; }
  .mins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mins div { text-align: center; padding: 4px 0 6px; border-radius: 8px; background: #0d1219; }
  .mins canvas { display: block; width: 72px; height: 78px; margin: 0 auto; }
  .mins b { display: block; font: bold 13px monospace; letter-spacing: 1px; color: #ffc478; }
  .mins small { display: block; font: 10px monospace; color: var(--dim); }
  .tones + .title { margin-top: 16px; }
  .designs { display: flex; flex-direction: column; gap: 8px; }
  .designs button, .tones button { background: #10141c; color: var(--dim); border: 1px solid rgba(0,191,255,0.25);
    font: bold 14px monospace; letter-spacing: 3px; }
  .tones { display: flex; gap: 8px; }
  .tones button { flex: 1; }
  #menu .title + .designs + .title { margin-top: 16px; }
  .designs button.on, .tones button.on { color: #ffc478; border-color: rgba(255,170,60,0.85); background: #241d10; }
  .card { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); z-index: 10; padding: 16px; }
  .card.on { display: flex; }
  .box { width: min(340px, 100%); background: #0a0f14; border: 1.5px solid rgba(255,170,60,0.55);
    border-radius: 12px; padding: 14px; }
  .title { color: rgba(255,190,90,0.9); font: bold 12px monospace; letter-spacing: 2px;
    text-align: center; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .row > span { color: #ffc478; font: bold 16px monospace; width: 18px; }
  .tern { display: flex; gap: 8px; flex: 1; }
  .tern button { flex: 1; min-height: 44px; font: bold 18px monospace; background: #10141c;
    color: var(--dim); border: 1px solid rgba(0,191,255,0.25); }
  .tern button.on { color: #ffc478; border-color: rgba(255,170,60,0.85); background: #241d10; }
  textarea { width: 100%; background: #000; color: #c7d3da; border: 1px solid rgba(0,191,255,0.35);
    border-radius: 8px; font: 14px monospace; padding: 8px; resize: none; margin: 4px 0 10px; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; }
  .acts button { background: #555; }
  .acts .go { background: #a9843e; color: #1d1608; }

  /* SCORE */
  #score { position: fixed; inset: 0; z-index: 10; background: #05070a; display: none;
    flex-direction: column; padding: env(safe-area-inset-top) 0 0; }
  #score.on { display: flex; }
  .sHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  .sHead b { letter-spacing: 3px; color: rgba(255,190,90,0.9); font-size: 13px; }
  .sHead button { background: #2a3442; min-height: 40px; }
  .now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 16px; }
  .now div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .now small { display: block; font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .now canvas { display: block; width: 84px; height: 92px; max-width: 100%; margin: 2px auto 0; }
  .now strong { display: block; font-size: 24px; margin: 0 0 2px; }
  .now em { font-style: normal; font-size: 11px; color: var(--dim); }
  .tabs { display: flex; gap: 6px; padding: 8px 16px; }
  .tabs button { flex: 1; min-height: 38px; background: #10141c; color: var(--dim);
    border: 1px solid rgba(0,191,255,0.25); font: bold 12px monospace; letter-spacing: 2px; }
  .tabs button.on { color: #ffc478; border-color: rgba(255,170,60,0.85); background: #241d10; }
  #list { flex: 1; overflow-y: auto; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
  .per { border-bottom: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
  .pRow { display: flex; align-items: center; gap: 10px; }
  .pRow canvas { width: 44px; height: 48px; flex: none; }
  .pMain { flex: 1; min-width: 0; }
  .pTop { display: flex; align-items: baseline; gap: 10px; }
  .pTop .lab { flex: 1; }
  .pTop .net { font-size: 20px; font-weight: bold; min-width: 44px; text-align: right; }
  .pSub { font-size: 11px; color: var(--dim); margin-top: 3px; display: flex; gap: 12px; }
  .sess { display: none; margin-top: 8px; }
  .per.open .sess { display: block; }
  .s1 { display: flex; gap: 10px; align-items: center; font-size: 12px; padding: 4px 0; color: #9fb0bf; }
  .s1 .tm { width: 44px; } .s1 .mn { width: 44px; color: var(--dim); }
  .s1 .note { flex-basis: 100%; color: var(--dim); font-size: 11px; padding-left: 54px; margin-top: -2px; }
  .s1 { flex-wrap: wrap; }
  .pip { display: inline-block; width: 22px; text-align: center; border-radius: 4px; font-weight: bold; }
  .pos { color: var(--amber); } .neg { color: var(--cool); } .zer { color: #6b7684; }
  .ver { color: #4a5563; font-size: 10px; letter-spacing: 2px; margin-top: 10px; }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; font-size: 12px; }
  .foot { text-align: center; padding: 16px 0 4px; }
  .foot button { background: transparent; color: var(--dim); font: 11px monospace; letter-spacing: 2px;
    min-height: 32px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main><canvas id="cv"></canvas>
  <button id="bMenu" aria-label="Designs"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg></button>
</main>
<footer>
  <button id="bView" aria-label="View"><i></i><i></i><i></i></button>
  <button id="bPlay" aria-label="Start"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
  <button id="bReset" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
  <button id="bLogs">LOGS</button>
</footer>

<div class="card" id="menu"><div class="box">
  <div class="title">DESIGN</div>
  <div class="designs"><button data-d="square">SQUARE</button><button data-d="sept">SEPT</button><button data-d="star">STAR</button><button data-d="hepta">HEPTA</button></div>
  <div class="title" id="toneTitle">LIGHT</div>
  <div class="tones" id="tones"><button data-t="white">WHITE</button><button data-t="amber">AMBER</button></div>
  <div class="title" id="circTitle">CIRCUITS</div>
  <div class="tones" id="circs"><button data-c="all">ALL</button><button data-c="min">MINUTES</button></div>
  <div class="title">MINUTES</div>
  <div class="mins" id="mins"></div>
</div></div>

<div class="card" id="verdict"><div class="box">
  <div class="title">THE SESSION CLOSES</div>
  <div class="row"><span>T</span><div class="tern" data-k="t">
    <button data-s="-1">&#8722;</button><button data-s="0">0</button><button data-s="1">+</button></div></div>
  <div class="row"><span>P</span><div class="tern" data-k="p">
    <button data-s="-1">&#8722;</button><button data-s="0">0</button><button data-s="1">+</button></div></div>
  <textarea id="vNote" rows="2" maxlength="200" placeholder="a note, if you want one"></textarea>
  <div class="acts">
    <button id="vBack">BACK</button><button id="vSkip">SKIP</button><button id="vSave" class="go">SAVE</button>
  </div>
</div></div>

<div id="score">
  <div class="sHead"><b>LOGS</b><button id="sClose">CLOSE</button></div>
  <div class="now" id="now"></div>
  <div class="tabs" id="tabs">
    <button data-g="day" class="on">DAY</button><button data-g="week">WEEK</button><button data-g="month">MONTH</button>
  </div>
  <div id="list"></div>
</div>

<script>
"use strict";
// Shown under LOGS, so the phone can say which release it is running.
// Bump it with the cache name in sw.js on every release.
const VERSION = "v30";
/* ---------- STORAGE ---------- */
const K_RUN = "sq.run", K_LOG = "sq.sessions", K_VIEW = "sq.view", K_DESIGN = "sq.design", K_TONE = "sq.tone", K_CIRC = "sq.circ";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// Sessions, newest first: { at, sec, t, p, n }. t/p are -1|0|1, absent if skipped.
let log = load(K_LOG, []);

// One-time import from the old Salvation app. On GitHub Pages both apps
// live on the same origin, so its ledger is readable here; it is never written.
if (!localStorage.getItem("sq.imported")) {
  const old = load("salvationSessions", []);
  const seen = new Set(log.map(s => s.at));
  for (const o of Array.isArray(old) ? old : []) {
    if (!o || !o.at || seen.has(o.at)) continue;
    const s = { at: o.at, sec: o.sec > 0 ? o.sec : (o.dur || 0) * 60 };
    if ("rt" in o) s.t = o.rt;
    if ("rp" in o) s.p = o.rp;
    if ("rw" in o) s.w = o.rw;   // the old W sessions: one rating, counted in the net
    if (o.nx) s.n = o.nx;
    log.push(s);
  }
  log.sort((a, b) => b.at - a.at);
  save(K_LOG, log);
  try { localStorage.setItem("sq.imported", "1"); } catch (e) {}
}

/* ---------- THE CLOCK ----------
   Everything is measured on the wall clock, so a locked screen or a
   killed page loses nothing: run = { start, paused, pauseAt, rung }.
   A session is always 27 minutes. */
const TOTAL = 27 * 60;
// Three views of the same session, keyed by one, two or three lights:
//  1: 81 x 81 lamps, one per 1/243 minute, the whole session
//  2: 27 x 27 lamps, one per 1/27 minute, the whole session
//  3: 27 x 27 lamps, one per 1/81 minute (the readout's fastest digit),
//     a third of the session - nine minutes, filled three times
const VIEWS = [{ N: 81, parts: 1 }, { N: 27, parts: 1 }, { N: 27, parts: 3 }];
let view = load(K_VIEW, load("sq.third", false) ? 2 : 0) % 3;
const grid = () => VIEWS[view].N;
const parts = () => VIEWS[view].parts;
const span = () => TOTAL / parts();
let run = load(K_RUN, null);
if (run && Date.now() - run.start > 12 * 3600e3) run = null;   // a stale run from yesterday

const elapsed = () => run ? ((run.pauseAt || Date.now()) - run.start - run.paused) / 1000 : 0;
const isRunning = () => !!run && !run.pauseAt;
const persist = () => { if (run) save(K_RUN, run); else localStorage.removeItem(K_RUN); };

function start() {
  unlockAudio();
  if (!run) run = { start: Date.now(), paused: 0, pauseAt: 0, rung: 0 };
  else if (run.pauseAt) { run.paused += Date.now() - run.pauseAt; run.pauseAt = 0; }
  persist(); wake(true); sync();
}
function pause() {
  if (!isRunning()) return;
  run.pauseAt = Date.now();
  persist(); wake(false); sync();
}
function finishReset(rating) {
  if (run && rating) {
    const s = { at: run.start, sec: Math.round(elapsed()) };
    if (rating.t != null) { s.t = rating.t; s.p = rating.p; }
    if (rating.n) s.n = rating.n;
    log.unshift(s);
    save(K_LOG, log);
  }
  run = null; persist(); wake(false); sync();
}

/* ---------- HAPTICS ----------
   The old app's three strengths: a tick for most taps, a firmer press
   for start / pause / reset / save, and a long pattern for the bell. */
const BUZZ = { light: 10, medium: 35, heavy: [60, 40, 60, 40, 120] };
const buzz = k => { try { if (navigator.vibrate) navigator.vibrate(BUZZ[k]); } catch (e) {} };
const FIRM = new Set(["bPlay", "bReset", "vSave", "bMenu"]);
// capture: buzz as the press lands, before the button's own handler runs
// (reset disables itself, which would otherwise read as a dead button)
document.addEventListener("click", e => {
  const t = e.target.closest("button, .per");
  if (t && !t.disabled) buzz(FIRM.has(t.id) ? "medium" : "light");
}, true);

/* ---------- BELL ---------- */
let audio = null;
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
function bell() {
  buzz("heavy");
  if (!audio) return;
  const t0 = audio.currentTime;
  [[523.25, 0, 0.3], [659.25, 0.15, 0.4], [783.99, 0.3, 0.5]].forEach(([f, at, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
    o.start(t0 + at); o.stop(t0 + at + d + 0.05);
  });
}

/* ---------- WAKE LOCK ---------- */
let lock = null;
async function wake(on) {
  try {
    if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.onrelease = () => { lock = null; }; }
    else if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (isRunning()) wake(true); dirty = true; }
});

/* ---------- THE SQUARE ----------
   3^8 lamps, 81 on a side. One lamp per 1/243 minute, filled in nested
   ternary order: a 3x3 is 1/27 of a minute, a 9x9 twenty seconds, a
   27x27 three minutes, and the whole square is 27 minutes.
   The 27-a-side views have 3^6 lamps. At one per 1/27 minute a 3x3 is a
   third of a minute, a 9x9 three minutes, the square the session; at one
   per 1/81 minute a 3x3 is 1/9 of a minute, a 9x9 one minute, and the
   square nine minutes. */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, L = null, dirty = true, lastKey = "";
let dimPlate = null, litPlate = null, litN = 0;

// The fix for the top-left square: read the canvas's real CSS box every
// frame and resize the backing store whenever it differs. No resize
// event, orientation event or launch timing can leave it stale.
function fit() {
  const w = cv.clientWidth, h = cv.clientHeight, d = Math.min(window.devicePixelRatio || 1, 2);
  if (!w || !h || (w === W && h === H && d === DPR)) return;
  W = w; H = h; DPR = d;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  L = layout(); dimPlate = litPlate = null; litN = 0; dirty = true;
}

function layout() {
  // the same frame in every view: the three 9-minute lamps above the
  // square, the readout (and any overtime) below it
  const pad = 12, topH = 44, readH = 84;
  const side = Math.max(81, Math.floor(Math.min(W - 2 * pad, H - 2 * pad - topH - readH)));
  // the nesting is spacing, not ink: a gutter at every 3 lamps, wider at
  // every 9, wider still at every 27. inc[k] is what the 3^k boundary adds.
  const N = grid(), F = N === 81 ? [0.0028, 0.0055, 0.0115] : [0.008, 0.02];
  const gap = F.map((f, i) => Math.max(0.8 * (i + 1), side * f));
  const inc = [0, ...gap.map((g, i) => g - (i ? gap[i - 1] : 0))];
  let used = 0;
  for (let k = 1; k < inc.length; k++) used += (N / Math.pow(3, k) - 1) * inc[k];
  const y0 = Math.round(topH + Math.max(pad, (H - side - topH - readH) / 2));
  return { side, N, inc, pitch: (side - used) / N, x0: Math.round((W - side) / 2), y0,
           lampY: y0 - 30, textY: y0 + side + 46 };
}
function pos(g) {
  let x = g * L.pitch;
  for (let k = 1, u = 3; k < L.inc.length; k++, u *= 3) x += Math.floor(g / u) * L.inc[k];
  return x;
}
function cell(n) {
  // n's base-nine digits place it at every scale at once
  let x = 0, y = 0;
  for (let sz = L.N / 3; sz >= 1; sz /= 3) {
    const b = Math.floor(n / (sz * sz)) % 9;
    x += (b % 3) * sz; y += Math.floor(b / 3) * sz;
  }
  return { x, y };
}
function plate() {
  const c = document.createElement("canvas");
  c.width = c.height = Math.max(2, Math.round(L.side * DPR));
  c.getContext("2d").scale(DPR, DPR);
  return c;
}
function lamps(c, from, to, color, r, ordered) {
  const g = c.getContext("2d");
  g.fillStyle = color; g.beginPath();
  for (let n = from; n < to; n++) {
    const o = ordered ? cell(n) : { x: n % L.N, y: Math.floor(n / L.N) };
    const cx = pos(o.x) + L.pitch / 2, cy = pos(o.y) + L.pitch / 2;
    g.moveTo(cx + r, cy); g.arc(cx, cy, r, 0, 2 * Math.PI);
  }
  g.fill();
}
function drawSquare(lit) {
  if (!dimPlate) { dimPlate = plate(); lamps(dimPlate, 0, L.N * L.N, "rgba(150,180,235,0.11)", Math.max(0.7, L.pitch * 0.40), false); }
  if (!litPlate || lit < litN) { litPlate = plate(); litN = 0; }
  if (lit > litN) { lamps(litPlate, litN, lit, "rgba(249,246,236,0.95)", Math.max(0.8, L.pitch * 0.42), true); litN = lit; }
  ctx.drawImage(dimPlate, L.x0, L.y0, L.side, L.side);
  if (lit) ctx.drawImage(litPlate, L.x0, L.y0, L.side, L.side);
}

/* ---------- READOUT ----------
   Base three: three places for the minute of the session, four for the
   fraction (thirds down to 81sts). Each digit is two lamps. In the
   three-light view the nines digit stays dark: the amber lamps above
   the square carry it there. */
function readout(el) {
  let m = Math.floor(el / 60) % 27, ms = "";
  for (let i = 0; i < 3; i++) { ms = (m % 3) + ms; m = Math.floor(m / 3); }
  return ms + ":" + frac(el);
}
function frac(el) {
  // the minute's thirds, ninths, 27ths and 81sts
  const f = el % 60;
  let fs = "";
  for (let i = 1; i <= 4; i++) fs += Math.floor(f / (60 / Math.pow(3, i))) % 3;
  return fs;
}
// overtime counts up in the same base: whole minutes, then the fraction
const overtime = sec => "+" + Math.floor(sec / 60).toString(3) + ":" + frac(sec) + "\u2083";
function drawLed(str, baseY, done, darkNines) {
  const s = W < 500 ? 15 : 18, gap = Math.round(s * 0.5), cw = Math.round(s * 0.45), r = s * 0.34;
  const nd = str.replace(":", "").length;               // digits; one colon
  let x = W / 2 - (nd * s + cw + nd * gap) / 2;
  const cy = baseY - s;
  let i = -1;
  for (let ch of str) {
    if (ch !== ":" && ++i === 0 && darkNines) ch = "0";
    if (ch === ":") {
      for (const dy of [-s * 0.5, s * 0.5]) {
        ctx.fillStyle = "rgba(225,238,255,0.2)"; ctx.beginPath(); ctx.arc(x + cw / 2, cy + dy, s * 0.28, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(x + cw / 2, cy + dy, s * 0.135, 0, 7); ctx.fill();
      }
      x += cw + gap; continue;
    }
    for (let k = 0; k < 2; k++) {
      const ly = cy + (k === 0 ? s * 0.55 : -s * 0.55), cx = x + s / 2;
      if (+ch > k) {

/* ---------- SEPT ----------

  const d = s.read.replace(":", "").split("").map(Number);   // m9 m3 m1 f3 f9 f27 f81

  figure([[X1 - i, Y0 + i], [X1 - i, Y0 + m], [X1 - m, Y0 + i]], d[5], true);   // 1/27
  figure([[X1 - i, Y1 - i], [X1 - m, Y1 - i], [X1 - i, Y1 - m]], d[4], true);   // 1/9

/* ---------- STAR ----------

   clockwise side) and its tip. Its third corner is the core of the next
   place up, and the triangle's sides are its wiring:

     edge      core -> next core   (lit while a 1 passes current to a lit neighbour)
     leads     centre -> circuit   (red for a single LED, orange for a string)

   27:00 it lights and the seven places roll to zero, and through the
   overtime the star keeps counting with the 27 lamp held lit.
   The heptagon edges carry nothing; they are drawn faint, as structure.
   Like clockwork, every stage moves on the same tick, at the same instant:

  const Rout = S * 0.42, Rin = obtuse ? Rout * HEPTA_IN : S * 0.205, live = !!run, warm = s.done || sepTone === "amber";
  const at = (k, rad) => { const a = -Math.PI / 2 + k * 2 * Math.PI / 7; return [CX + rad * Math.cos(a), CY + rad * Math.sin(a)]; };

/* ---------- FRAME ---------- */

  const el = elapsed(), T = TOTAL, done = !!run && el >= T;
  const S = span(), n = grid() * grid(), e = Math.min(el, T), blk = e % S, inSq = (blk === 0 && e > 0) ? S : blk;
  return { el, done, lit: Math.min(n, Math.floor(inSq / (S / n))),

}

  if (run && !run.rung && elapsed() >= TOTAL) { run.rung = 1; persist(); bell(); sync(); }
}
function frame() {
  requestAnimationFrame(frame);
  fit();
  if (!L) return;
  check();
  const s = state(), key = s.lit + s.read + s.over + s.done + view + design + !!run;
  if (!dirty && key === lastKey) return;   // nothing new to show: draw nothing
  dirty = false; lastKey = key;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const thirdsView = design === "square" && parts() === 3;
  if (design === "sept") drawSept(s); else if (design === "star" || design === "hepta") drawStar(s, design === "hepta"); else drawSquare(s.lit);
  // the 100 / 200 / 1000 lamps belong to SQUARE; SEPT and STAR show the nines themselves
  if (design === "square") drawNines(Math.min(s.el, TOTAL), L.lampY, thirdsView);
  drawLed(s.read, L.textY, s.done, thirdsView);
  if (s.over) {
    ctx.font = (W < 500 ? 19 : 23) + "px monospace"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,149,0,0.7)";
    ctx.fillText(s.over, W / 2, L.textY + 32);
  }
}
setInterval(check, 1000);   // the bell rings even if frames are throttled

/* ---------- CONTROLS ---------- */
const $ = id => document.getElementById(id);

  const idle = !run, done = !!run && elapsed() >= TOTAL;
  [...$("bView").children].forEach((d, i) => d.classList.toggle("on", i <= view));
  $("bView").disabled = design !== "square";   // the views belong to the square
  for (const b of document.querySelectorAll(".designs button")) b.classList.toggle("on", b.dataset.d === design);
  for (const b of $("tones").children) b.classList.toggle("on", b.dataset.t === sepTone);
  $("toneTitle").style.display = $("tones").style.display = design === "square" ? "none" : "";
  for (const b of $("circs").children) b.classList.toggle("on", b.dataset.c === circ);
  $("circTitle").style.display = $("circs").style.display = design === "star" || design === "hepta" ? "" : "none";
  $("playIcon").setAttribute("d", isRunning() && !done ? "M6 5h4v14H6zM14 5h4v14h-4z" : "M8 5v14l11-7z");
  $("bPlay").setAttribute("aria-label", isRunning() ? "Pause" : idle ? "Start" : "Resume");
  $("bPlay").disabled = done;

}
$("bView").onclick = () => {
  view = (view + 1) % 3; save(K_VIEW, view);
  if (L) { L = layout(); dimPlate = litPlate = null; litN = 0; }
  sync();
};
// the menu opens and closes only by its own key
function minutes() {
  $("mins").innerHTML = Array.from({ length: 27 }, (_, i) => {
    const m = i + 1;
    return `<div><canvas data-m="${m}"></canvas><b>${m.toString(3).padStart(3, "0")}</b><small>${m} min</small></div>`;
  }).join("");
  for (const c of $("mins").children) { const cv = c.firstChild; scoreGlyph(cv, +cv.dataset.m * 81, 72, 78); }
}
$("bMenu").onclick = () => {
  const open = !$("menu").classList.contains("on");
  if (open) minutes();
  $("menu").classList.toggle("on", open); $("bMenu").classList.toggle("open", open);
};
for (const b of $("tones").children) b.onclick = () => { sepTone = b.dataset.t; save(K_TONE, sepTone); sync(); };
for (const b of $("circs").children) b.onclick = () => { circ = b.dataset.c; save(K_CIRC, circ); sync(); };
for (const b of document.querySelectorAll(".designs button")) b.onclick = () => {

  minutes(); sync();
};
$("bPlay").onclick = () => isRunning() ? pause() : start();

  if (!run) return;
  pause();
  if (elapsed() < 60) return finishReset(null);   // under a minute: not a session
  openVerdict();
};
$("bLogs").onclick = openScore;

/* ---------- VERDICT ---------- */
let vote = { t: 0, p: 0 };
function paintVote() {
  for (const tern of document.querySelectorAll("#verdict .tern"))
    for (const b of tern.children) b.classList.toggle("on", +b.dataset.s === vote[tern.dataset.k]);
}
for (const tern of document.querySelectorAll("#verdict .tern"))
  for (const b of tern.children) b.onclick = () => { vote[tern.dataset.k] = +b.dataset.s; paintVote(); };
function openVerdict() { vote = { t: 0, p: 0 }; paintVote(); $("vNote").value = ""; $("verdict").classList.add("on"); }

$("vBack").onclick = closeVerdict;
$("vSkip").onclick = () => { closeVerdict(); finishReset({}); };

/* ---------- SCORE ----------

}

}

const signed = v => v > 0 ? "+" + v : v < 0 ? "−" + -v : "0";
const tone = v => v > 0 ? "pos" : v < 0 ? "neg" : "zer";

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// A score drawn on the star: |v| in base three, ones on the 1/81 spike, the

// over a faint skeleton; the sign lives in the number beside it.

  const n = Math.min(Math.abs(v), 4373), x = n >= 2187 ? 1 : 0, d = [];

  ctx.moveTo(...P.T0); ctx.lineTo(...P.X); ctx.stroke();
  ctx.beginPath(); for (const [a, b] of seg) { ctx.moveTo(...a); ctx.lineTo(...b); }
  ctx.strokeStyle = "rgba(255,177,74,0.22)"; ctx.lineWidth = w * 3; ctx.stroke();
  ctx.strokeStyle = "#ffb14a"; ctx.lineWidth = w; ctx.stroke();
}
const base3 = v => (v < 0 ? "−" : "") + Math.abs(v).toString(3) + "₃";

function renderScore() {
  const now = Date.now();
  $("now").innerHTML = [["TODAY", "day"], ["WEEK", "week"], ["MONTH", "month"]].map(([lab, g]) => {
    const a = sum(log.filter(s => periodStart(s.at, g) === periodStart(now, g)));
    return `<div><small>${lab}</small><canvas data-v="${a.net}"></canvas><strong class="${tone(a.net)}">${signed(a.net)}</strong>` +
           `<em>${a.n} · ${hm(a.sec)}</em></div>`;
  }).join("");

  const groups = new Map([[periodStart(now, gran), []]]);
  for (const s of log) {
    const k = periodStart(s.at, gran);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  const rows = [...groups].sort((a, b) => b[0] - a[0]).slice(0, 90);
  $("list").innerHTML = (log.length ? rows.map(([k, l]) => {
    const a = sum(l);
    const sess = l.map(s => {
      const d = new Date(s.at), when = gran === "day" ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " ";
      const rated = s.t != null || s.w != null;
      return `<div class="s1"><span class="tm">${when}${pad2(d.getHours())}:${pad2(d.getMinutes())}</span>` +
             `<span class="mn">${hm(s.sec || 0)}</span>` +
             (s.w != null ? pip(s.w, "W") : pip(rated ? s.t : null, "T") + pip(rated ? s.p : null, "P")) +
             (s.n ? `<span class="note">${esc(s.n)}</span>` : "") + `</div>`;
    }).join("");
    return `<div class="per"><div class="pRow"><canvas data-v="${a.net}"></canvas><div class="pMain">` +
           `<div class="pTop"><span class="lab">${periodLabel(k, gran)}</span>` +
           `<span class="net ${tone(a.net)}">${signed(a.net)}</span></div>` +
           `<div class="pSub"><span>${a.n} session${a.n === 1 ? "" : "s"}</span><span>${hm(a.sec)}</span>` +
           `<span>T ${signed(a.t)}</span><span>P ${signed(a.p)}</span>${a.hasW ? `<span>W ${signed(a.w)}</span>` : ""}` +
           `<span>${base3(a.net)}</span></div></div></div><div class="sess">${sess}</div></div>`;
  }).join("") : `<div class="empty">No sessions yet. Finish one and rate it.</div>`) +
  `<div class="foot"><button id="sExport">EXPORT</button><div class="ver">${VERSION}</div></div>`;
  for (const c of $("now").querySelectorAll("canvas")) scoreGlyph(c, +c.dataset.v, 84, 92);
  for (const c of $("list").querySelectorAll(".per canvas")) scoreGlyph(c, +c.dataset.v, 44, 48);
  for (const el of $("list").querySelectorAll(".per")) el.onclick = () => el.classList.toggle("open");
  $("sExport").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(log, null, 1)], { type: "application/json" }));
    a.download = "square-sessions-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
  };
}
function openScore() { renderScore(); $("score").classList.add("on"); }
$("sClose").onclick = () => $("score").classList.remove("on");
for (const b of $("tabs").children) b.onclick = () => {
  gran = b.dataset.g;
  for (const c of $("tabs").children) c.classList.toggle("on", c === b);
  renderScore();
};

/* ---------- GO ---------- */
if (isRunning()) wake(true);
sync();
requestAnimationFrame(frame);
if ("serviceWorker" in navigator) {
  // look for a new version on every launch and every return to the app
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update(); });
  }).catch(() => {});
  // When a new version takes over, show it at once instead of on the next
  // cold start. The run lives on the wall clock in storage, so reloading
  // loses nothing - but wait while a card or the logs are open.
  const hadWorker = !!navigator.serviceWorker.controller;
  let reloadDue = false;
  const busy = () => document.querySelector(".card.on, #score.on");
  const reloadIfIdle = () => { if (reloadDue && !busy()) location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadWorker) return;   // the very first install, not an update
    reloadDue = true; reloadIfIdle();
  });
  document.addEventListener("click", () => setTimeout(reloadIfIdle, 0));
}
</script>
